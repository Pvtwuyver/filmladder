name: Update bioscoopdata

on:
  schedule:
    # 06:00 UTC = 08:00 zomertijd / 07:00 wintertijd in Amsterdam
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/scrape.py --debug

      - name: Commit data indien gewijzigd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/now_playing.json data/upcoming.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in data."
          else
            git commit -m "Automatische update bioscoopdata $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
