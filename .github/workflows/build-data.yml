name: Filmdataset bijwerken

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 1" # elke maandag 04:00 UTC

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependencies installeren
        run: npm install

      - name: Dataset genereren
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run build:data

      - name: Wijzigingen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          git diff --staged --quiet || git commit -m "Filmdataset bijgewerkt"
          git push
